<title>Yes DOOH Demonstração</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: barra escura fixa de navegação no topo; abaixo, uma coluna de trabalho.
   Na página da tela, a TV fica à esquerda e a fila da playlist à direita. */
:root {
  --bg: #f2f4f8; --surface: #ffffff; --ink: #0d1424; --muted: #5d6a84; --line: #dde3ee;
  --accent: #f2b705; --accent-ink: #0d1424; --bar: #0d1424; --bar-ink: #c9d1e2;
  --ok: #0b8a5d; --ok-bg: #d9f5e9; --idle-bg: #e6eaf2; --danger: #c62828; --note-bg: #fff6d6; --note-ink: #5c4500;
  --display: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
  --body: 'Inter', system-ui, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090d18; --surface: #131a2b; --ink: #eef1f7; --muted: #9ba7c0; --line: #27314b;
    --accent: #f2b705; --accent-ink: #0d1424; --bar: #05080f; --bar-ink: #c9d1e2;
    --ok: #4fd3a1; --ok-bg: #0f3a2c; --idle-bg: #232c44; --danger: #ff7b72; --note-bg: #33290a; --note-ink: #f6dd8a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090d18; --surface: #131a2b; --ink: #eef1f7; --muted: #9ba7c0; --line: #27314b;
  --accent: #f2b705; --accent-ink: #0d1424; --bar: #05080f; --bar-ink: #c9d1e2;
  --ok: #4fd3a1; --ok-bg: #0f3a2c; --idle-bg: #232c44; --danger: #ff7b72; --note-bg: #33290a; --note-ink: #f6dd8a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.05rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.bar { background: var(--bar); color: #fff; }
.bar-in, .wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; padding-block: 12px; }
.logo { font: 700 1.25rem var(--display); letter-spacing: -.01em; }
.logo b { color: var(--accent); }
nav { display: flex; flex-wrap: wrap; gap: 4px; }
nav button { background: none; border: 0; border-radius: 8px; padding: 7px 12px; color: var(--bar-ink); font-weight: 600; font-size: .9rem; cursor: pointer; }
nav button:hover { color: #fff; background: rgba(255,255,255,.08); }
nav button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.wrap { padding-block: 22px 48px; display: flex; flex-direction: column; gap: 18px; }

.note { background: var(--note-bg); color: var(--note-ink); border-radius: 10px; padding: 10px 14px; font-size: .88rem; }
.head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.crumb { color: var(--muted); font-size: .85rem; }
.crumb button { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; cursor: pointer; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cols { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.stat b { display: block; font: 700 2rem/1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: .85rem; }
.muted { color: var(--muted); font-size: .85rem; }

.btn { border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 700; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.sm { padding: 5px 9px; font-size: .82rem; }
.btn.danger { background: none; border: 1px solid var(--line); color: var(--danger); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 2px 10px; font-size: .78rem; font-weight: 700; background: var(--idle-bg); color: var(--muted); white-space: nowrap; }
.badge.on { background: var(--ok-bg); color: var(--ok); }
.badge.on::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

label { display: flex; flex-direction: column; gap: 4px; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); min-width: 0; }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: .92rem; font-weight: 400; text-transform: none; letter-spacing: 0; width: 100%; }
input[type=color] { padding: 2px; height: 38px; }
.form { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); align-items: end; }
.form .wide { grid-column: 1 / -1; }
.types { display: flex; flex-wrap: wrap; gap: 6px; }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.list .grow { flex: 1; min-width: 0; }
.list .name { font-weight: 600; overflow-wrap: anywhere; }
.acts { display: flex; gap: 4px; flex-shrink: 0; }
.thumb { width: 72px; aspect-ratio: 16 / 9; border-radius: 6px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font: 700 .6rem var(--display); text-align: center; overflow: hidden; padding: 2px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.screen-card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
.screen-card:hover { border-color: var(--accent); }
.screen-card h3 { font-size: 1rem; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 8px; }
td { padding: 9px 8px; border-top: 1px solid var(--line); }
td.num, th.num { text-align: right; }
.meter { height: 8px; border-radius: 4px; background: var(--idle-bg); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }

/* TV: mundo visual próprio do player, sempre escuro */
.stage-grid { display: grid; gap: 18px; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 820px) { .stage-grid { grid-template-columns: minmax(0, 1fr); } }
.tvbox { background: #05070d; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.tv { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; color: #fff; overflow: hidden; border-radius: 6px; display: flex; flex-direction: column; margin: 0 auto; font-family: var(--body); }
.tv.vertical { aspect-ratio: 9 / 16; max-height: 70vh; width: auto; }
.tv .slide { position: relative; flex: 1; min-height: 0; }
.tv .fill { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
.tv .center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: calc(var(--u) * 2.5); padding: calc(var(--u) * 6); }
.tv img.fill, .tv video.fill { object-fit: contain; background: #000; }
.tv .foot { display: flex; align-items: center; gap: calc(var(--u) * 3); padding: calc(var(--u) * 1.4) calc(var(--u) * 3); font-size: calc(var(--u) * 3.2); font-weight: 700; background: #000; }
.tv .foot span:first-child { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tvbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: #c9d1e2; font-size: .82rem; }
.tvbar .now { flex: 1; min-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tvbar button { background: #1a2236; color: #fff; border: 0; border-radius: 6px; padding: 6px 10px; font-weight: 600; cursor: pointer; font-size: .82rem; }
.tvbox.max { position: fixed; inset: 0; z-index: 50; border-radius: 0; justify-content: center; padding: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); }
.tvbox.max .tv { max-height: calc(100% - 50px); width: auto; height: 100%; }
.tvbox.max .tv.vertical { max-height: calc(100% - 50px); }
@media (prefers-reduced-motion: no-preference) { .tv .slide > * { animation: fade .35s ease-out; } }
@keyframes fade { from { opacity: .2; } to { opacity: 1; } }
</style>

<header class="bar"><div class="bar-in">
  <span class="logo">Yes<b>DOOH</b></span>
  <nav id="nav" aria-label="Seções"></nav>
</div></header>
<main class="wrap" id="app"></main>

<script>
(function () {
  'use strict';

  // ---------- dados de exemplo ----------
  var NEWS = [
    'Comércio da região projeta alta nas vendas de fim de ano',
    'Prefeitura anuncia novo horário para a feira de sábado',
    'Time da cidade vence fora de casa e sobe na tabela',
    'Campanha de vacinação segue até sexta nos postos de saúde',
    'Festival de música gratuito acontece na praça central no domingo'
  ];
  var TYPES = { cartaz: 'Anúncio (arte pronta)', arquivo: 'Imagem ou vídeo do computador', aviso: 'Aviso de texto', noticias: 'Notícias', clima: 'Previsão do tempo', hora: 'Hora certa', dolar: 'Cotação do dólar' };
  var SHORT = { cartaz: 'Anúncio', arquivo: 'Arquivo', aviso: 'Aviso', noticias: 'Notícias', clima: 'Clima', hora: 'Hora certa', dolar: 'Dólar' };
  var KEY = 'yesdooh-demo-v1';

  function seed() {
    return {
      seq: 20,
      screens: [
        { id: 1, name: 'Academia Corpo Ativo — Recepção', orient: 'H', city: 'Ribeirão Preto', footer: true, online: true },
        { id: 2, name: 'Restaurante Sabor da Praça', orient: 'H', city: 'Ribeirão Preto', footer: false, online: true },
        { id: 3, name: 'Ótica Visão Clara — Vitrine', orient: 'V', city: 'Franca', footer: true, online: false }
      ],
      medias: [
        { id: 10, type: 'cartaz', name: 'Matrícula sem taxa', client: 'Academia Corpo Ativo', duration: 8, active: true, cfg: { bg: '#1b2a6b', color: '#ffd84d', text: 'Matricule-se em novembro e ganhe a avaliação física' } },
        { id: 11, type: 'cartaz', name: 'Almoço executivo R$ 29,90', client: 'Restaurante Sabor da Praça', duration: 8, active: true, cfg: { bg: '#7a2412', color: '#ffe9c7', text: 'De segunda a sexta, das 11h às 15h' } },
        { id: 12, type: 'cartaz', name: 'Óculos de grau em 10x', client: 'Ótica Visão Clara', duration: 8, active: true, cfg: { bg: '#0d4d43', color: '#d6fff3', text: 'Exame de vista grátis na compra da armação' } },
        { id: 13, type: 'aviso', name: 'Anuncie aqui', client: '', duration: 7, active: true, cfg: { bg: '#0d1424', color: '#f2b705', text: 'Sua marca vista por quem passa todos os dias. Fale com a gente!' } },
        { id: 14, type: 'noticias', name: 'Notícias da cidade', client: '', duration: 8, active: true, cfg: { bg: '#141a2b', color: '#ffffff' } },
        { id: 15, type: 'clima', name: 'Previsão do tempo', client: '', duration: 7, active: true, cfg: { bg: '#0c4a6e', color: '#ffffff' } },
        { id: 16, type: 'hora', name: 'Hora certa', client: '', duration: 6, active: true, cfg: { bg: '#0d1424', color: '#f2b705' } },
        { id: 17, type: 'dolar', name: 'Cotação do dólar', client: '', duration: 6, active: true, cfg: { bg: '#064e3b', color: '#ffffff' } }
      ],
      playlists: { 1: [10, 14, 11, 15, 12, 16, 13], 2: [11, 14, 10, 17, 13], 3: [12, 16, 13] },
      plays: {}
    };
  }

  var state;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
  if (!state || !state.screens || !state.medias) state = seed();
  var files = {};      // arquivos enviados: ficam só nesta sessão do navegador
  var view = 'painel', current = null, mediaType = 'cartaz', player = null, flash = '';

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* sem armazenamento: segue em memória */ }
  }
  // arquivos enviados não sobrevivem ao recarregar a página: tira-os do estado salvo
  state.medias = state.medias.filter(function (m) { return m.type !== 'arquivo'; });
  Object.keys(state.playlists).forEach(function (k) {
    state.playlists[k] = state.playlists[k].filter(function (id) { return media(id); });
  });

  function media(id) { return state.medias.filter(function (m) { return m.id === id; })[0]; }
  function screen(id) { return state.screens.filter(function (s) { return s.id === id; })[0]; }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function dur(s) { return Math.floor(s / 60) + ':' + ('0' + Math.round(s % 60)).slice(-2); }
  function fmt(n) { return Number(n).toLocaleString('pt-BR'); }
  function color(v, d) { return /^#[0-9a-f]{6}$/i.test(v || '') ? v : d; }
  function totalPlays(filter) {
    var t = 0;
    Object.keys(state.plays).forEach(function (sid) {
      Object.keys(state.plays[sid]).forEach(function (mid) { if (!filter || filter(Number(sid), Number(mid))) t += state.plays[sid][mid]; });
    });
    return t;
  }

  // ---------- player (o que roda na TV) ----------
  function Player(tv, screenId, onChange) {
    this.tv = tv; this.sid = screenId; this.onChange = onChange;
    this.slide = tv.querySelector('.slide'); this.idx = -1; this.n = 0; this.paused = false; this.timer = null; this.clock = null;
    var self = this;
    this.ro = new ResizeObserver(function () { self.fit(); });
    this.ro.observe(tv); this.fit(); this.footer(); this.next();
  }
  Player.prototype.fit = function () {
    var r = this.tv.getBoundingClientRect();
    this.tv.style.setProperty('--u', Math.min(r.width, r.height) / 100 + 'px');
  };
  Player.prototype.footer = function () {
    var s = screen(this.sid), f = this.tv.querySelector('.foot'), self = this;
    f.hidden = !s.footer;
    clearInterval(this.clock);
    if (!s.footer) return;
    var tick = function () { f.lastElementChild.textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
    tick(); this.clock = setInterval(tick, 10000);
  };
  Player.prototype.items = function () {
    return (state.playlists[this.sid] || []).map(media).filter(function (m) { return m && m.active; });
  };
  Player.prototype.next = function () {
    clearTimeout(this.timer);
    var list = this.items();
    if (!list.length) { this.cur = null; this.empty(); this.onChange(null); return; }
    this.idx = (this.idx + 1) % list.length; this.n++;
    var m = list[this.idx]; this.cur = m;
    var p = state.plays[this.sid] || (state.plays[this.sid] = {});
    p[m.id] = (p[m.id] || 0) + 1; save();          // comprovação de exibição
    this.show(m); this.onChange(m);
    this.arm(m.duration + (m.kind === 'video' ? 6 : 0));
  };
  Player.prototype.arm = function (sec) {
    var self = this; clearTimeout(this.timer);
    if (!this.paused) this.timer = setTimeout(function () { self.next(); }, sec * 1000);
  };
  Player.prototype.toggle = function () {
    this.paused = !this.paused;
    var v = this.slide.querySelector('video');
    if (this.paused) { clearTimeout(this.timer); if (v) v.pause(); }
    else { if (v) v.play().catch(function () {}); this.arm(this.cur ? Math.min(this.cur.duration, 4) : 1); }
    return this.paused;
  };
  Player.prototype.el = function (tag, css, text) {
    var e = document.createElement(tag); if (css) e.style.cssText = css; if (text != null) e.textContent = text; return e;
  };
  Player.prototype.empty = function () {
    this.slide.innerHTML = '';
    var d = this.el('div', 'background:#0d1424'); d.className = 'fill center';
    d.appendChild(this.el('p', 'font:700 calc(var(--u)*6) var(--display)', 'YesDOOH'));
    d.appendChild(this.el('p', 'font-size:calc(var(--u)*3.4);opacity:.75', 'Adicione conteúdos à playlist desta tela.'));
    this.slide.appendChild(d);
  };
  Player.prototype.show = function (m) {
    var self = this, el = this.el, cfg = m.cfg || {}, bg = color(cfg.bg, '#0d1424'), fg = color(cfg.color, '#ffffff');
    this.slide.innerHTML = '';
    if (m.type === 'arquivo') {
      var f = files[m.id];
      if (!f) return this.empty();
      var node = document.createElement(m.kind === 'video' ? 'video' : 'img');
      node.className = 'fill';
      if (m.kind === 'video') { node.muted = true; node.autoplay = true; node.playsInline = true; node.onended = function () { if (!self.paused) self.next(); }; }
      node.onerror = function () { self.arm(1); };
      node.src = f; this.slide.appendChild(node);
      if (m.kind === 'video') node.play().catch(function () {});
      return;
    }
    var box = el('div', 'background:' + bg + ';color:' + fg); box.className = 'fill center';
    this.slide.appendChild(box);
    var label = 'font-size:calc(var(--u)*4);opacity:.85', big = 'font:700 calc(var(--u)*14)/1 var(--display)';
    if (m.type === 'cartaz') {
      if (m.client) box.appendChild(el('p', 'font-size:calc(var(--u)*3.2);font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.8', m.client));
      box.appendChild(el('p', 'font:700 calc(var(--u)*10)/1.05 var(--display);text-wrap:balance', m.name));
      box.appendChild(el('p', 'font-size:calc(var(--u)*4.4);max-width:85%', cfg.text || ''));
    } else if (m.type === 'aviso') {
      box.appendChild(el('p', 'font:700 calc(var(--u)*8)/1.1 var(--display)', m.name));
      box.appendChild(el('p', 'font-size:calc(var(--u)*4.6);line-height:1.35;color:#fff;max-width:88%;white-space:pre-wrap', cfg.text || ''));
    } else if (m.type === 'hora') {
      box.appendChild(el('p', label, new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' })));
      box.appendChild(el('p', 'font:700 calc(var(--u)*24)/1 var(--display);font-variant-numeric:tabular-nums', new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })));
    } else if (m.type === 'clima') {
      box.appendChild(el('p', label, 'Tempo agora em ' + (screen(this.sid).city || 'sua cidade')));
      box.appendChild(el('p', 'font:700 calc(var(--u)*22)/1 var(--display)', '27°C'));
      box.appendChild(el('p', 'font-size:calc(var(--u)*5.5);font-weight:700', 'Parcialmente nublado'));
      box.appendChild(el('p', label, 'Máx. 31° · Mín. 20°'));
    } else if (m.type === 'dolar') {
      box.appendChild(el('p', label, 'Cotação do dólar hoje'));
      box.appendChild(el('p', big, 'R$ 5,42'));
      box.appendChild(el('p', label, '▲ 0,18% no dia'));
    } else if (m.type === 'noticias') {
      box.className = 'fill'; box.style.display = 'flex'; box.style.flexDirection = 'column'; box.style.justifyContent = 'flex-end';
      box.style.padding = 'calc(var(--u)*6)'; box.style.gap = 'calc(var(--u)*2)';
      box.appendChild(el('p', 'font-size:calc(var(--u)*3);font-weight:800;text-transform:uppercase;letter-spacing:.1em;opacity:.8', m.name));
      box.appendChild(el('p', 'font:700 calc(var(--u)*7.5)/1.12 var(--display);text-wrap:balance', NEWS[this.n % NEWS.length]));
    }
  };
  Player.prototype.destroy = function () { clearTimeout(this.timer); clearInterval(this.clock); this.ro.disconnect(); };

  // ---------- telas do painel ----------
  var app = document.getElementById('app');
  var NAV = [['painel', 'Painel'], ['telas', 'Minhas telas'], ['conteudos', 'Conteúdos'], ['relatorio', 'Relatório']];

  function thumb(m) {
    var c = m.cfg || {};
    if (m.type === 'arquivo') return '<span class="thumb" style="background:#05070d;color:#fff">' + (m.kind === 'image' && files[m.id] ? '<img src="' + files[m.id] + '" alt="">' : 'VÍDEO') + '</span>';
    return '<span class="thumb" style="background:' + color(c.bg, '#0d1424') + ';color:' + color(c.color, '#fff') + '">' + esc(SHORT[m.type]) + '</span>';
  }
  function badge(s) { return '<span class="badge' + (s.online ? ' on' : '') + '">' + (s.online ? 'Online' : 'Offline') + '</span>'; }
  function cycle(sid) { return (state.playlists[sid] || []).map(media).filter(Boolean).reduce(function (a, m) { return a + m.duration; }, 0); }
  function note() {
    return '<p class="note"><b>Versão de demonstração.</b> Tudo roda no seu navegador, sem servidor: os dados ficam só neste aparelho. Notícias, clima e dólar usam valores de exemplo, e as telas são simuladas.</p>';
  }
  function msg() { var m = flash; flash = ''; return m ? '<p class="note" role="status">' + esc(m) + '</p>' : ''; }

  function vPainel() {
    var on = state.screens.filter(function (s) { return s.online; }).length, max = 1;
    var rows = state.screens.map(function (s) { var n = totalPlays(function (sid) { return sid === s.id; }); max = Math.max(max, n); return [s, n]; });
    return note() + '<div class="head"><h1>Sua rede de telas</h1></div>' +
      '<div class="cols">' +
        '<div class="panel stat"><b style="color:var(--ok)">' + on + '</b><span>telas online de ' + state.screens.length + '</span></div>' +
        '<div class="panel stat"><b>' + state.medias.filter(function (m) { return m.active; }).length + '</b><span>conteúdos ativos</span></div>' +
        '<div class="panel stat"><b>' + fmt(totalPlays()) + '</b><span>exibições registradas nesta demonstração</span></div>' +
      '</div>' +
      '<div class="panel"><h2>Exibições por tela</h2><ul class="list">' + rows.map(function (r) {
        return '<li><div class="grow"><p class="name">' + esc(r[0].name) + '</p><div class="meter" role="img" aria-label="' + r[1] + ' exibições"><i style="width:' + (r[1] / max * 100) + '%"></i></div></div><b style="font-variant-numeric:tabular-nums">' + fmt(r[1]) + '</b></li>';
      }).join('') + '</ul><p class="muted">Abra uma tela em “Minhas telas” para vê-la tocando; cada conteúdo exibido soma aqui.</p></div>';
  }

  function vTelas() {
    return msg() + '<div class="head"><h1>Minhas telas</h1></div><div class="cols">' + state.screens.map(function (s) {
      return '<button class="screen-card" data-act="abrir" data-id="' + s.id + '"><span>' + badge(s) + '</span><h3>' + esc(s.name) + '</h3>' +
        '<span class="muted">' + (s.orient === 'V' ? 'Vertical' : 'Horizontal') + (s.city ? ' · ' + esc(s.city) : '') + '</span>' +
        '<span class="muted">' + (state.playlists[s.id] || []).length + ' conteúdos · ciclo de ' + dur(cycle(s.id)) + '</span></button>';
    }).join('') + '</div>' +
    '<form class="panel" data-form="tela"><h2>Nova tela</h2><div class="form">' +
      '<label>Nome<input id="t-nome" name="name" required maxlength="60" placeholder="Ex.: Padaria Pão Quente — Balcão"></label>' +
      '<label>Orientação<select id="t-orient" name="orient"><option value="H">Horizontal</option><option value="V">Vertical</option></select></label>' +
      '<label>Cidade<input id="t-cidade" name="city" maxlength="40"></label>' +
      '<div><button class="btn">Criar tela</button></div></div></form>';
  }

  function vTela() {
    var s = screen(current);
    return '<p class="crumb"><button data-act="ir" data-view="telas">Minhas telas</button> / ' + esc(s.name) + '</p>' +
      '<div class="head"><h1>' + esc(s.name) + '</h1><div class="acts">' + badge(s) +
        '<button class="btn ghost sm" data-act="rodape">' + (s.footer ? 'Ocultar rodapé' : 'Exibir rodapé') + '</button>' +
        '<button class="btn danger sm" data-act="excluir-tela">Excluir tela</button></div></div>' +
      '<div class="stage-grid">' +
        '<div class="tvbox" id="tvbox"><div class="tv' + (s.orient === 'V' ? ' vertical' : '') + '" id="tv"><div class="slide"></div><div class="foot" hidden><span>Anuncie aqui</span><span></span></div></div>' +
          '<div class="tvbar"><span class="now" id="now" aria-live="polite"></span>' +
            '<button data-act="pausa" id="pausa">Pausar</button><button data-act="proximo">Próximo</button><button data-act="max" id="max">Ampliar</button></div></div>' +
        '<div class="panel" id="pl"></div>' +
      '</div>';
  }
  function renderPlaylist() {
    var list = (state.playlists[current] || []).map(media).filter(Boolean), s = screen(current);
    var opts = state.medias.filter(function (m) { return m.active; }).map(function (m) { return '<option value="' + m.id + '">' + esc(SHORT[m.type] + ' — ' + m.name) + '</option>'; }).join('');
    document.getElementById('pl').innerHTML =
      '<h2>Playlist · ' + list.length + ' mídias · ' + dur(cycle(current)) + ' de ciclo</h2>' +
      (list.length ? '<ul class="list">' + list.map(function (m, i) {
        return '<li>' + thumb(m) + '<div class="grow"><p class="name">' + esc(m.name) + '</p><p class="muted">' + esc(SHORT[m.type]) + ' · ' + dur(m.duration) + (m.active ? '' : ' · inativo') + '</p></div>' +
          '<div class="acts"><button class="btn ghost sm" data-act="subir" data-i="' + i + '" aria-label="Subir ' + esc(m.name) + '"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
          '<button class="btn ghost sm" data-act="descer" data-i="' + i + '" aria-label="Descer ' + esc(m.name) + '"' + (i === list.length - 1 ? ' disabled' : '') + '>↓</button>' +
          '<button class="btn ghost sm" data-act="tirar" data-i="' + i + '" aria-label="Remover ' + esc(m.name) + '">✕</button></div></li>';
      }).join('') + '</ul>' : '<p class="muted">Nenhum conteúdo nesta playlist ainda.</p>') +
      '<form class="form" data-form="add"><label class="wide">Adicionar conteúdo<select id="add-midia" name="media" required><option value="">Selecione...</option>' + opts + '</select></label>' +
      '<div><button class="btn">Adicionar</button></div></form>' +
      '<p class="muted">A TV ao lado mostra o que o box Android exibiria na ' + (s.orient === 'V' ? 'tela vertical' : 'tela horizontal') + '. As mudanças valem a partir do próximo conteúdo.</p>';
  }

  function vConteudos() {
    var t = mediaType, extra = '';
    if (t === 'arquivo') extra = '<label class="wide">Arquivo de imagem ou vídeo<input id="c-arquivo" type="file" name="file" accept="image/*,video/*" required></label>';
    if (t === 'cartaz') extra = '<label>Anunciante<input id="c-cliente" name="client" maxlength="40" placeholder="Ex.: Padaria Pão Quente"></label>';
    var text = t === 'cartaz' || t === 'aviso' ? '<label class="wide">' + (t === 'aviso' ? 'Texto do aviso' : 'Chamada (linha de apoio)') + '<textarea id="c-texto" name="text" rows="2" maxlength="200" required></textarea></label>' : '';
    var colors = t === 'arquivo' ? '' : '<label>Cor de fundo<input id="c-bg" type="color" name="bg" value="#0d1424"></label><label>Cor do texto<input id="c-cor" type="color" name="color" value="#f2b705"></label>';
    return msg() + '<div class="head"><h1>Conteúdos</h1></div>' +
      '<form class="panel" data-form="midia"><h2>Novo conteúdo</h2><div class="types">' + Object.keys(TYPES).map(function (k) {
        return '<button type="button" class="btn sm' + (k === t ? '' : ' ghost') + '" data-act="tipo" data-tipo="' + k + '" aria-pressed="' + (k === t) + '">' + esc(SHORT[k]) + '</button>';
      }).join('') + '</div><p class="muted">' + esc(TYPES[t]) + (t === 'arquivo' ? '. O arquivo fica só nesta sessão: ao recarregar a página ele sai da demonstração.' : '') + '</p>' +
      '<div class="form"><label>' + (t === 'cartaz' ? 'Título do anúncio' : 'Nome') + '<input id="c-nome" name="name" required maxlength="60"></label>' + extra +
      '<label>Duração (segundos)<input id="c-dur" type="number" name="duration" min="3" max="120" value="8" required></label>' + colors + text +
      '<div><button class="btn">Salvar conteúdo</button></div></div></form>' +
      '<div class="panel"><ul class="list">' + state.medias.map(function (m) {
        var n = Object.keys(state.playlists).filter(function (k) { return state.playlists[k].indexOf(m.id) >= 0; }).length;
        return '<li>' + thumb(m) + '<div class="grow"><p class="name">' + esc(m.name) + '</p><p class="muted">' + esc(SHORT[m.type]) + (m.client ? ' · ' + esc(m.client) : '') + ' · ' + dur(m.duration) + ' · em ' + n + ' tela(s)</p></div>' +
          '<div class="acts"><span class="badge' + (m.active ? ' on' : '') + '">' + (m.active ? 'Ativo' : 'Inativo') + '</span>' +
          '<button class="btn ghost sm" data-act="ativar" data-id="' + m.id + '">' + (m.active ? 'Desativar' : 'Ativar') + '</button>' +
          '<button class="btn danger sm" data-act="excluir-midia" data-id="' + m.id + '">Excluir</button></div></li>';
      }).join('') + '</ul></div>';
  }

  function vRelatorio() {
    var rows = state.medias.map(function (m) {
      var n = totalPlays(function (sid, mid) { return mid === m.id; });
      var t = Object.keys(state.plays).filter(function (sid) { return state.plays[sid][m.id]; }).length;
      return { m: m, n: n, t: t };
    }).filter(function (r) { return r.n; }).sort(function (a, b) { return b.n - a.n; });
    return '<div class="head"><h1>Relatório de exibições</h1><button class="btn ghost sm" data-act="zerar">Zerar contagem</button></div>' +
      '<p class="muted">É a comprovação que vai para o anunciante: quantas vezes cada conteúdo foi ao ar e em quantas telas. Aqui a contagem vem das telas que você abriu nesta demonstração.</p>' +
      '<div class="panel">' + (rows.length ? '<div class="tablewrap"><table><thead><tr><th>Conteúdo</th><th>Anunciante</th><th class="num">Exibições</th><th class="num">Tempo no ar</th><th class="num">Telas</th></tr></thead><tbody>' +
        rows.map(function (r) { return '<tr><td><b>' + esc(r.m.name) + '</b></td><td>' + esc(r.m.client || 'Avulso') + '</td><td class="num">' + fmt(r.n) + '</td><td class="num">' + dur(r.n * r.m.duration) + '</td><td class="num">' + r.t + '</td></tr>'; }).join('') +
        '</tbody></table></div>' : '<p class="muted">Nenhuma exibição ainda. Abra uma tela em “Minhas telas” e deixe tocar.</p>') + '</div>';
  }

  // ---------- navegação e ações ----------
  function render() {
    if (player) { player.destroy(); player = null; }
    if (view === 'tela' && !screen(current)) view = 'telas';
    document.getElementById('nav').innerHTML = NAV.map(function (n) {
      var on = view === n[0] || (view === 'tela' && n[0] === 'telas');
      return '<button data-act="ir" data-view="' + n[0] + '"' + (on ? ' aria-current="page"' : '') + '>' + n[1] + '</button>';
    }).join('');
    app.innerHTML = { painel: vPainel, telas: vTelas, tela: vTela, conteudos: vConteudos, relatorio: vRelatorio }[view]();
    if (view === 'tela') {
      renderPlaylist();
      player = new Player(document.getElementById('tv'), current, function (m) {
        document.getElementById('now').textContent = m ? 'No ar: ' + m.name : 'Playlist vazia';
      });
    }
    try { if (location.hash !== '#' + (view === 'tela' ? 'telas' : view)) history.replaceState(null, '', '#' + (view === 'tela' ? 'telas' : view)); } catch (e) { /* sem acesso ao endereço */ }
  }
  function go(v) { view = v; render(); window.scrollTo(0, 0); }

  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b) return;
    var act = b.dataset.act, id = Number(b.dataset.id), i = Number(b.dataset.i), pl = state.playlists[current];
    if (act === 'ir') return go(b.dataset.view);
    if (act === 'abrir') { current = id; return go('tela'); }
    if (act === 'tipo') { mediaType = b.dataset.tipo; return render(); }
    if (act === 'subir' || act === 'descer') { var j = act === 'subir' ? i - 1 : i + 1; var x = pl[i]; pl[i] = pl[j]; pl[j] = x; save(); return renderPlaylist(); }
    if (act === 'tirar') { pl.splice(i, 1); save(); return renderPlaylist(); }
    if (act === 'proximo') return player && player.next();
    if (act === 'pausa') { if (player) b.textContent = player.toggle() ? 'Continuar' : 'Pausar'; return; }
    if (act === 'max') { var on = document.getElementById('tvbox').classList.toggle('max'); b.textContent = on ? 'Reduzir' : 'Ampliar'; return; }
    if (act === 'rodape') { var s = screen(current); s.footer = !s.footer; save(); b.textContent = s.footer ? 'Ocultar rodapé' : 'Exibir rodapé'; return player && player.footer(); }
    if (act === 'excluir-tela') {
      state.screens = state.screens.filter(function (s) { return s.id !== current; });
      delete state.playlists[current]; delete state.plays[current]; save(); flash = 'Tela excluída.'; return go('telas');
    }
    if (act === 'ativar') { var m = media(id); m.active = !m.active; save(); return render(); }
    if (act === 'excluir-midia') {
      state.medias = state.medias.filter(function (m) { return m.id !== id; });
      Object.keys(state.playlists).forEach(function (k) { state.playlists[k] = state.playlists[k].filter(function (x) { return x !== id; }); });
      if (files[id]) { URL.revokeObjectURL(files[id]); delete files[id]; }
      save(); flash = 'Conteúdo excluído de todas as playlists.'; return render();
    }
    if (act === 'zerar') { state.plays = {}; save(); return render(); }
  });
  document.addEventListener('keydown', function (ev) {
    var box = document.getElementById('tvbox');
    if (ev.key === 'Escape' && box && box.classList.contains('max')) { box.classList.remove('max'); document.getElementById('max').textContent = 'Ampliar'; }
  });

  document.addEventListener('submit', function (ev) {
    var f = ev.target.closest('[data-form]');
    if (!f) return;
    ev.preventDefault();
    var d = new FormData(f), kind = f.dataset.form;
    if (kind === 'tela') {
      var s = { id: ++state.seq, name: String(d.get('name')).trim(), orient: d.get('orient') === 'V' ? 'V' : 'H', city: String(d.get('city')).trim(), footer: true, online: true };
      if (!s.name) return;
      state.screens.push(s); state.playlists[s.id] = []; save(); current = s.id; return go('tela');
    }
    if (kind === 'add') {
      var mid = Number(d.get('media'));
      if (media(mid)) { state.playlists[current].push(mid); save(); renderPlaylist(); }
      return;
    }
    if (kind === 'midia') {
      var m = { id: ++state.seq, type: mediaType, name: String(d.get('name')).trim(), client: String(d.get('client') || '').trim(), active: true,
        duration: Math.max(3, Math.min(120, Number(d.get('duration')) || 8)), cfg: { bg: color(d.get('bg'), '#0d1424'), color: color(d.get('color'), '#ffffff'), text: String(d.get('text') || '').slice(0, 200) } };
      if (!m.name) return;
      var done = function () { state.medias.unshift(m); save(); flash = 'Conteúdo salvo. Adicione-o à playlist de uma tela para vê-lo no ar.'; render(); };
      if (mediaType !== 'arquivo') return done();
      var file = d.get('file');
      if (!file || !/^(image|video)\//.test(file.type)) { flash = 'Escolha um arquivo de imagem ou vídeo.'; return render(); }
      m.kind = file.type.indexOf('video/') === 0 ? 'video' : 'image';
      files[m.id] = URL.createObjectURL(file);
      if (m.kind !== 'video') return done();
      var v = document.createElement('video'); v.preload = 'metadata';   // vídeo usa a duração real do arquivo
      v.onloadedmetadata = function () { if (isFinite(v.duration)) m.duration = Math.max(3, Math.round(v.duration)); done(); };
      v.onerror = done; v.src = files[m.id];
    }
  });

  function fromHash() {
    var h = location.hash.slice(1);
    if (NAV.some(function (n) { return n[0] === h; }) && h !== (view === 'tela' ? 'telas' : view)) { view = h; render(); }
  }
  window.addEventListener('hashchange', fromHash);
  var h0 = location.hash.slice(1);
  if (NAV.some(function (n) { return n[0] === h0; })) view = h0;
  render();
})();
</script>
